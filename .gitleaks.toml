title = "Square secret scanning rules"

[[rules]]
id = "hardcoded-aws-secret"
description = "AWS access key identifiers"
regex = '''"(?:AWS|aws)(?:_?)?(?:ACCESS_?KEY_?ID|SECRET_?ACCESS_?KEY)"'''
path = '''^(frontend/|shared/|backend/|infra/|[^/]+\.(json|yml|yaml|ts|tsx|js|env|env\.example)$)'''

[[rules]]
id = "hardcoded-api-key"
description = "Hardcoded API key identifiers"
regex = '''"(?:api_?key|apikey)"'''
path = '''^(frontend/|shared/|backend/|infra/|[^/]+\.(json|yml|yaml|ts|tsx|js|env|env\.example)$)'''

[[rules]]
id = "hardcoded-secret-key"
description = "Hardcoded secret key identifiers"
regex = '''"(?:secret_?key|secretkey)"'''
path = '''^(frontend/|shared/|backend/|infra/|[^/]+\.(json|yml|yaml|ts|tsx|js|env|env\.example)$)'''

[[rules]]
id = "hardcoded-private-key"
description = "Private key headers"
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''
path = '''^(frontend/|shared/|backend/|infra/|[^/]+\.(json|yml|yaml|ts|tsx|js|env|env\.example)$)'''

[[rules]]
id = "hardcoded-database-url"
description = "Database URLs containing credentials"
regex = '''(?:postgres|postgresql|mongodb|redis)://[^:]+:[^@]+@'''
path = '''^(frontend/|shared/|backend/|infra/|[^/]+\.(json|yml|yaml|ts|tsx|js|env|env\.example)$)'''

[[rules.allowlists]]
description = "localhost connection strings in development configs"
regexes = ['''postgres://square:square@localhost:5432/square''']

[[rules]]
id = "hardcoded-github-token"
description = "GitHub tokens"
regex = '''gh[pousr]_[A-Za-z0-9_]{20,}'''
path = '''^(frontend/|shared/|backend/|infra/|[^/]+\.(json|yml|yaml|ts|tsx|js|env|env\.example)$)'''

[[rules]]
id = "hardcoded-slack-token"
description = "Slack tokens"
regex = '''"xox[bapr]-[0-9a-zA-Z-]{10,}"'''
path = '''^(frontend/|shared/|backend/|infra/|[^/]+\.(json|yml|yaml|ts|tsx|js|env|env\.example)$)'''

[[rules]]
id = "hardcoded-stripe-key"
description = "Stripe API keys"
regex = '''sk_(?:live|test)_[A-Za-z0-9]{24,}'''
path = '''^(frontend/|shared/|backend/|infra/|[^/]+\.(json|yml|yaml|ts|tsx|js|env|env\.example)$)'''
