services:
  gateway:
    build:
      context: ../..
      dockerfile: backend/gateway/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      SERVICES: all
      DATABASE_URL: postgresql://square:square@postgres:5432/square
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      JWT_ISSUER: square
      JWT_AUDIENCE: square-api
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER:-}
      AUTH_TEST_MODE: ${AUTH_TEST_MODE:-false}
    ports:
      - "${GATEWAY_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: backend/gateway/Dockerfile
    command: ["pnpm", "start:worker"]
    profiles: ["launch"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://square:square@postgres:5432/square
      REDIS_URL: redis://redis:6379
    depends_on:
      gateway:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: square
      POSTGRES_USER: square
      POSTGRES_PASSWORD: square
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U square -d square"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
