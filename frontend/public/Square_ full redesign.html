&lt;body&gt;
&lt;h1&gt;Square: new sidebar concept&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Communities are hex badges with a blue unread ring. People are robot faces. Click any hex to make it active, and hover (or focus) one to see its name.&lt;/p&gt;

&lt;h2&gt;Desktop&lt;/h2&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;div class=&quot;app desk&quot; id=&quot;desk&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h2&gt;Mobile&lt;/h2&gt;
&lt;div class=&quot;app phone&quot; id=&quot;phone&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;On mobile the hex rail stays on the left but narrows to 62px, so the layout matches your current screens while the shape and rings carry the new identity.&lt;/p&gt;

&lt;script&gt;
var COMM=[{k:&#x27;WC&#x27;,n:&#x27;Web3 Club&#x27;,u:12,r:.75},{k:&#x27;DL&#x27;,n:&#x27;Design Lab&#x27;,u:3,r:.25},{k:&#x27;AI&#x27;,n:&#x27;AI Builders&#x27;,u:0,r:0},{k:&#x27;GC&#x27;,n:&#x27;Game Circle&#x27;,u:0,r:0},{k:&#x27;MC&#x27;,n:&#x27;Maker Corner&#x27;,u:5,r:.45}];
var DMS=[[&#x27;tunde-ade&#x27;,&#x27;See you at the lab by 5?&#x27;,&#x27;19m&#x27;,2,1],[&#x27;chioma-n&#x27;,&#x27;Thanks for the feedback!&#x27;,&#x27;1h&#x27;,0,1],[&#x27;zainab-b&#x27;,&#x27;Sending the draft tonight.&#x27;,&#x27;5h&#x27;,1,1],[&#x27;victory-gray&#x27;,&#x27;You can’t message this user&#x27;,&#x27;1d&#x27;,0,0],[&#x27;sam-okoro&#x27;,&#x27;The servo arrived, testing later.&#x27;,&#x27;1d&#x27;,0,0],[&#x27;david-k&#x27;,&#x27;Photos from the walk are up.&#x27;,&#x27;1w&#x27;,0,1]];
var active=0;
var PTS=&#x27;26,3 49,16 49,42 26,55 3,42 3,16&#x27;;
function hexSvg(k,on,ring,extra){
  var per=159,len=Math.round(per*ring);
  return &#x27;&lt;svg viewBox=&quot;0 0 52 58&quot; aria-hidden=&quot;true&quot;&gt;&#x27;+
   (ring&gt;0?&#x27;&lt;polygon points=&quot;&#x27;+PTS+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;#38c0ff&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot; stroke-dasharray=&quot;&#x27;+len+&#x27; &#x27;+per+&#x27;&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;:&#x27;&lt;polygon points=&quot;&#x27;+PTS+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;#222c27&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27;)+
   &#x27;&lt;g transform=&quot;translate(26 29) scale(.76) translate(-26 -29)&quot;&gt;&lt;polygon points=&quot;&#x27;+PTS+&#x27;&quot; fill=&quot;&#x27;+(on?&#x27;#a6ff1a&#x27;:&#x27;#151d19&#x27;)+&#x27;&quot; stroke=&quot;&#x27;+(on?&#x27;#a6ff1a&#x27;:&#x27;#2c3832&#x27;)+&#x27;&quot; stroke-width=&quot;1.5&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/g&gt;&#x27;+
   &#x27;&lt;text x=&quot;26&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;&#x27;+(on?&#x27;#0a0e0c&#x27;:&#x27;#a6ff1a&#x27;)+&#x27;&quot;&gt;&#x27;+k+&#x27;&lt;/text&gt;&lt;/svg&gt;&#x27;;
}
function logo(){
  return &#x27;&lt;button class=&quot;hex&quot; aria-label=&quot;Square home&quot;&gt;&lt;svg viewBox=&quot;0 0 52 58&quot; aria-hidden=&quot;true&quot;&gt;&lt;polygon points=&quot;&#x27;+PTS+&#x27;&quot; fill=&quot;#a6ff1a&quot; stroke-linejoin=&quot;round&quot; stroke=&quot;#a6ff1a&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M33 20h-9a5 5 0 0 0 0 10h4a2 2 0 0 1 0 4H19M19 24&quot; fill=&quot;none&quot; stroke=&quot;#0a0e0c&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;badge&quot;&gt;3&lt;/span&gt;&lt;/button&gt;&#x27;;

function rail(){
  var h=logo()+&#x27;&lt;div class=&quot;sep&quot;&gt;&lt;/div&gt;&#x27;;
  COMM.forEach(function(c,i){
    h+=&#x27;&lt;button class=&quot;hex&quot; data-i=&quot;&#x27;+i+&#x27;&quot; aria-label=&quot;&#x27;+c.n+(c.u?&#x27;, &#x27;+c.u+&#x27; unread&#x27;:&#x27;&#x27;)+&#x27;&quot; aria-pressed=&quot;&#x27;+(i===active)+&#x27;&quot;&gt;&#x27;+hexSvg(c.k,i===active,c.r)+&#x27;&lt;span class=&quot;tip&quot;&gt;&#x27;+c.n+(c.u?&#x27; · &#x27;+c.u+&#x27; new&#x27;:&#x27;&#x27;)+&#x27;&lt;/span&gt;&lt;/button&gt;&#x27;;

  return h;
}
function face(i,blue){
  var c=blue?&#x27;#38c0ff&#x27;:&#x27;#a6ff1a&#x27;,e=&#x27;&#x27;,x=&#x27;&#x27;;
  var s=i%6;
  if(s===0)e=&#x27;&lt;path d=&quot;M15 19q2.5-4 5 0M21 19q2.5-4 5 0&quot; stroke=&quot;&#x27;+c+&#x27;&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;;
  if(s===1)e=&#x27;&lt;rect x=&quot;16&quot; y=&quot;15.5&quot; width=&quot;2.6&quot; height=&quot;6&quot; rx=&quot;1.3&quot; fill=&quot;&#x27;+c+&#x27;&quot;/&gt;&lt;rect x=&quot;22.4&quot; y=&quot;15.5&quot; width=&quot;2.6&quot; height=&quot;6&quot; rx=&quot;1.3&quot; fill=&quot;&#x27;+c+&#x27;&quot;/&gt;&#x27;;
  if(s===2){e=&#x27;&lt;circle cx=&quot;17&quot; cy=&quot;18.5&quot; r=&quot;2&quot; fill=&quot;&#x27;+c+&#x27;&quot;/&gt;&lt;circle cx=&quot;24&quot; cy=&quot;18.5&quot; r=&quot;2&quot; fill=&quot;&#x27;+c+&#x27;&quot;/&gt;&#x27;;x=&#x27;&lt;path d=&quot;M9 14L8 4l8 5zM32 14l1-10-8 5z&quot; fill=&quot;#e8ecef&quot;/&gt;&#x27;;}
  if(s===3){e=&#x27;&lt;path d=&quot;M15 15.5l4 3-4 3M26 15.5l-4 3 4 3&quot; stroke=&quot;&#x27;+c+&#x27;&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&#x27;;x=&#x27;&lt;path d=&quot;M20.5 8V3&quot; stroke=&quot;#e8ecef&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;circle cx=&quot;20.5&quot; cy=&quot;2.5&quot; r=&quot;1.8&quot; fill=&quot;&#x27;+c+&#x27;&quot;/&gt;&#x27;;}
  if(s===4)e=&#x27;&lt;path d=&quot;M14 18.5h13&quot; stroke=&quot;&#x27;+c+&#x27;&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;;
  if(s===5)e=&#x27;&lt;path d=&quot;M15 19q2.5-4 5 0&quot; stroke=&quot;&#x27;+c+&#x27;&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;24.5&quot; cy=&quot;18&quot; r=&quot;2.2&quot; fill=&quot;&#x27;+c+&#x27;&quot;/&gt;&#x27;;
  return &#x27;&lt;svg viewBox=&quot;0 0 41 41&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect width=&quot;41&quot; height=&quot;41&quot; rx=&quot;12&quot; fill=&quot;#18211c&quot;/&gt;&#x27;+x+&#x27;&lt;path d=&quot;M6 41c0-9 6-12 14.500-12s14.500 3 14.500 12z&quot; fill=&quot;#e8ecef&quot;/&gt;&lt;rect x=&quot;9&quot; y=&quot;7&quot; width=&quot;23&quot; height=&quot;21&quot; rx=&quot;9.500&quot; fill=&quot;#e8ecef&quot;/&gt;&lt;rect x=&quot;12&quot; y=&quot;12&quot; width=&quot;17&quot; height=&quot;12&quot; rx=&quot;6&quot; fill=&quot;#0a0e0c&quot;/&gt;&#x27;+e+&#x27;&lt;/svg&gt;&#x27;;

  return DMS.map(function(d,i){

  &#x27;&lt;div class=&quot;main&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;b&gt;Discover&lt;/b&gt;Tuesday, November 24&lt;/div&gt;&lt;div&gt;Notifications&lt;/div&gt;&lt;/div&gt;&#x27;+
